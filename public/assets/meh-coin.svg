<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <radialGradient id="coinGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2c2d32"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="85%" stop-color="#0e0e11"/>
      <stop offset="100%" stop-color="#050507"/>
    </radialGradient>
    
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52525b"/>
      <stop offset="25%" stop-color="#27272a"/>
      <stop offset="50%" stop-color="#71717a"/>
      <stop offset="75%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#3f3f46"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4d4d8"/>
    </linearGradient>

    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="0" dy="4"/>
      <feGaussianBlur stdDeviation="6" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#000" flood-opacity="0.7" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <!-- Path for circular text -->
    <path id="textCircle" d="M 250,250 m -180,0 a 180,180 0 1,1 360,0 a 180,180 0 1,1 -360,0" fill="none"/>
  </defs>

  <!-- Outer Drop Shadow Container -->
  <g filter="url(#subtleGlow)">
    <!-- Outer Rim Ring -->
    <circle cx="250" cy="250" r="235" fill="url(#rimGrad)" stroke="#18181b" stroke-width="4"/>
    
    <!-- Milled Edge Marks -->
    <circle cx="250" cy="250" r="225" fill="none" stroke="#3f3f46" stroke-width="6" stroke-dasharray="3 7"/>

    <!-- Inner Rim -->
    <circle cx="250" cy="250" r="215" fill="#09090b" stroke="#27272a" stroke-width="2"/>

    <!-- Coin Face with Radial Gradient -->
    <circle cx="250" cy="250" r="205" fill="url(#coinGrad)" filter="url(#innerShadow)"/>

    <!-- Circular Track Inscription -->
    <circle cx="250" cy="250" r="180" fill="none" stroke="#27272a" stroke-width="1" stroke-dasharray="8 8"/>
    
    <text font-family="'Space Grotesk', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#a1a1aa" letter-spacing="4.5">
      <textPath href="#textCircle" startOffset="0%">
        $MEH • WHATEVER HAPPENS, HAPPENS • SOLANA MEMECOIN • ZERO PROMISES • 1,000,000,000 SUPPLY •
      </textPath>
    </text>

    <!-- Center Border Ring -->
    <circle cx="250" cy="250" r="140" fill="none" stroke="#3f3f46" stroke-width="2"/>
    <circle cx="250" cy="250" r="132" fill="#121215" stroke="#27272a" stroke-width="1.5"/>

    <!-- Center Typography -->
    <!-- "Meh." in high impact grotesque -->
    <text x="250" y="245" 
          font-family="'Space Grotesk', -apple-system, system-ui, sans-serif" 
          font-size="96" 
          font-weight="900" 
          fill="url(#textGrad)" 
          text-anchor="middle" 
          letter-spacing="-4">Meh.</text>
    
    <!-- Phonetic "/mɛ/" in elegant serif -->
    <text x="250" y="295" 
          font-family="'Newsreader', Georgia, serif" 
          font-size="34" 
          font-style="italic" 
          font-weight="400" 
          fill="#a1a1aa" 
          text-anchor="middle" 
          letter-spacing="1">/mɛ/</text>

    <!-- Subtitle: certified indifferent -->
    <rect x="180" y="325" width="140" height="22" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <text x="250" y="340" 
          font-family="'JetBrains Mono', monospace" 
          font-size="9" 
          font-weight="700" 
          fill="#71717a" 
          text-anchor="middle" 
          letter-spacing="2">0% EFFORT • TAP</text>

    <!-- Minimal Solana Accent Lines -->
    <path d="M 235,145 L 265,145 M 230,150 L 260,150 M 235,155 L 265,155" stroke="#71717a" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
